name: CI - Fase 5

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build imagen Docker
        run: docker build -t reto-devops:ci .

      - name: Run contenedor
        run: docker run -d --name test-app -p 5000:5000 reto-devops:ci

      - name: Esperar a que Flask arranque
        run: sleep 5

      - name: Test endpoint principal
        run: curl --fail http://localhost:5000/

      - name: Test health endpoint
        run: curl --fail http://localhost:5000/health

      - name: Logs por si falla
        if: failure()
        run: docker logs test-app

      - name: Limpiar
        if: always()
        run: docker rm -f test-app || true
